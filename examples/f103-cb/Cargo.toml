[package]
authors = ["asmeenk12@gmail.com>"]
categories = [
  "embedded",
  "science::robotics",
  "no-std",
  "no-std::no-alloc",
]
edition = "2021"
keywords = ["foc", "bldc", "motor", "vector-control", "nucleo-f103_cb", "rtic_2_0"]
license = "MIT OR Apache-2.0"
name = "f103-cb"
version = "0.1.0"

[dependencies]
# Optie A: Reset het micro-controller board direct bij een panic

defmt     = { version="1.1"}
defmt-rtt = { version="1.3"}
panic-halt= "1.0"

cordic = "0.1.5"
cortex-m = {features = ["critical-section-single-core"], version = "0.7"}
cortex-m-rt = "0.7"
embedded-hal = "1.0"
fixed = "1.31"
foc-simple-rtic = {path = "../..", version = "0.1.0"}
heapless = {version = "0.9", default-features = false}
rtic = {features = ["thumbv7-backend", "test-critical-section"], version = "2.2.0"}
rtic-monotonics = {features = ["cortex-m-systick"], version = "2.1.0"}
stm32f1xx-hal = {features = ["rtic", "stm32f103", "medium"], version = "0.11.0"}
rtic-sync = {version = "1.5", features = []}

[profile.release]
lto = true # Enable link-time optimization
opt-level = 'z' # Optimize for size
codegen-units = 1 # Better LTO and dead-code elimination (at the cost of longer compile times)
panic = "abort"  # Removes unwinding stack-table overhead
strip = true     # Strip symbols and debug info from the binary

[profile.dev.package."*"]
opt-level = "z"
