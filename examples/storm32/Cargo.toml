[package]
authors = ["asmeenk12@gmail.com>"]
categories = [
  "embedded",
  "science::robotics",
  "no-std",
  "no-std::no-alloc",
  "RTIC 2.0"
]
edition = "2021"
keywords = ["foc", "bldc", "motor", "vector-control", "nucleo-f103_cb", "rtic_2_0"]
license = "MIT OR Apache-2.0"
name = "storm32"
version = "0.1.0"

[dependencies]
as5600 = "0.8.0"
cordic = "0.1.5"
cortex-m = {features = ["critical-section-single-core"], version = "0.7"}
cortex-m-rt = "0.7"
defmt = "1.0.1"
embassy-sync = {version = "0.7.0", features = ["defmt"]}
embedded-hal = "1.0"
fixed = "1.31"
foc = "0.3.0"
foc-simple-rtic = {path = "../..", version = "0.1.0"}
heapless = {version = "0.9", default-features = false}
log = {version = "0.4"}
panic-rtt-target = {version = "0.2.0"}
rtic = {features = ["thumbv7-backend", "test-critical-section"], version = "2.2"}
rtic-monotonics = {features = ["cortex-m-systick"], version = "2.1"}
rtic-sync = {version = "1.5", features = []}
rtt-target = {version = "0.6.1", features = ["log", "defmt"]}
stm32f1 = "0.16.0"
stm32f1xx-hal = {features = ["rtic", "stm32f103", "medium"], version = "0.11"}

[profile.release]
codegen-units = 1 # Reduce number of codegen units to increase optimizations
lto = true # Enable link-time optimization
opt-level = 'z' # Optimize for size
panic = 'abort' # Abort on panic
strip = true # Strip symbols from binary*

[profile.dev.package."*"]
opt-level = "z"
